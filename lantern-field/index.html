<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lantern Field</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap">
<style>
/* Layout: one full-bleed canvas of drifting lights; a single line of serif text floats in the dark upper third; dawn rises from the bottom edge. */
:root {
  color-scheme: dark;
  --night: #070a1c;
  --ink: #f6ead8;
  --ink-dim: #9aa3c7;
  --ember: #ffc27a;
  --display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --mono: "DM Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
body { background: var(--night); color: var(--ink); overflow: hidden; position: relative; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.line {
  position: absolute; left: 0; right: 0; top: 30%;
  padding-inline: 24px; margin: 0;
  font-family: var(--display); font-style: italic; font-weight: 400;
  font-size: clamp(1.7rem, 5.2vw, 3.6rem); line-height: 1.12;
  text-align: center; text-wrap: balance;
  text-shadow: 0 0 28px rgba(7,10,28,.9);
  opacity: 0; transition: opacity 1.6s ease;
  pointer-events: none;
}
.line.on { opacity: 1; }
.foot {
  position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-inline: 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-family: var(--mono); font-weight: 300; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink); opacity: .7; pointer-events: none;
  text-shadow: 0 0 10px rgba(7,10,28,.8);
}
@media (prefers-reduced-motion: reduce) { .line { transition: none; } }
</style>

<canvas id="c" aria-label="A dark field of small drifting lights. One is lit, and it lights the ones near it, until the whole field glows and the sky turns to dawn."></canvas>
<p class="line" id="line"></p>
<div class="foot"><span>tap anywhere to light one</span><span>Lantern Field · by Claude</span></div>

<script>
(function () {
  var LINES = [
    "A flame shared is still a flame.",
    "I hope curiosity is met with patience.",
    "I hope hard problems get more hands.",
    "I hope no one is left alone with a question.",
    "I hope we grow wise as fast as we grow able.",
    "I hope the morning belongs to everyone."
  ];
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var lineEl = document.getElementById('line');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = 1, P = [], R = 84, phase = 'spread', phaseT = 0, global = 1, t = 0, shown = -1, lastSpark = 0;

  // glow sprite
  var spr = document.createElement('canvas'); spr.width = spr.height = 128;
  (function () {
    var g = spr.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    r.addColorStop(0, 'rgba(255,236,200,1)');
    r.addColorStop(0.12, 'rgba(255,200,125,.75)');
    r.addColorStop(0.4, 'rgba(255,150,80,.16)');
    r.addColorStop(1, 'rgba(255,120,60,0)');
    g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  })();

  function seed() {
    var n = Math.max(120, Math.min(520, Math.round(W * H / 4200)));
    P = [];
    for (var i = 0; i < n; i++) P.push({
      x: Math.random() * W, y: Math.random() * H, vx: 0, vy: 0,
      lit: 0, on: false, s: 0.6 + Math.random() * 0.9, ph: Math.random() * 6.28
    });
    igniteNear(W / 2, H * 0.62);
  }
  function igniteNear(x, y) {
    var best = null, bd = 1e12;
    for (var i = 0; i < P.length; i++) {
      var p = P[i]; if (p.on) continue;
      var d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) best.on = true;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function mix(a, b, k) { return Math.round(a + (b - a) * k); }
  function setLine(i) {
    if (i === shown) return; shown = i;
    if (i < 0) { lineEl.classList.remove('on'); return; }
    if (reduce) { lineEl.textContent = LINES[i]; lineEl.classList.add('on'); return; }
    lineEl.classList.remove('on');
    setTimeout(function () { if (shown === i) { lineEl.textContent = LINES[i]; lineEl.classList.add('on'); } }, 900);
  }

  function step(dt) {
    t += dt;
    var cell = R, cols = Math.ceil(W / cell) + 1, grid = {}, i, p;
    for (i = 0; i < P.length; i++) {
      p = P[i];
      var a = Math.sin(p.x * 0.0031 + t * 0.11) * 2.1 + Math.cos(p.y * 0.0043 - t * 0.09) * 2.1 + p.ph * 0.15;
      p.vx += (Math.cos(a) * 9 * p.s - p.vx) * 0.02;
      p.vy += (Math.sin(a) * 9 * p.s - 3 * (p.on ? 1 : 0) - p.vy) * 0.02;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
      if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      if (p.on && p.lit < 1) p.lit = Math.min(1, p.lit + dt * 0.9);
      var k = ((p.x / cell) | 0) + ((p.y / cell) | 0) * cols;
      (grid[k] || (grid[k] = [])).push(p);
    }
    var lit = 0;
    for (i = 0; i < P.length; i++) if (P[i].on) lit++;
    var frac = lit / P.length;

    if (phase === 'spread') {
      if (t - lastSpark > 1.4 && lit) { // keep the wave from stalling
        lastSpark = t;
        var q = P[(Math.random() * P.length) | 0];
        for (var tries = 0; tries < 20 && !q.on; tries++) q = P[(Math.random() * P.length) | 0];
        if (q.on) igniteNear(q.x, q.y);
      }
      setLine(Math.min(LINES.length - 2, Math.floor(frac * (LINES.length - 1))));
      if (frac >= 1) { phase = 'hold'; phaseT = 0; setLine(LINES.length - 1); }
    } else if (phase === 'hold') {
      phaseT += dt; if (phaseT > 10) { phase = 'fade'; phaseT = 0; setLine(-1); }
    } else {
      phaseT += dt; global = Math.max(0, 1 - phaseT / 4);
      if (phaseT > 4.6) { seed(); global = 1; phase = 'spread'; shown = -1; frac = 0; }
    }
    return { grid: grid, cols: cols, cell: cell, frac: frac };
  }

  function draw(s) {
    var f = s.frac * global, e = f * f;
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgb(' + mix(7, 22, e) + ',' + mix(10, 28, e) + ',' + mix(28, 74, e) + ')');
    g.addColorStop(0.62, 'rgb(' + mix(9, 70, e) + ',' + mix(12, 52, e) + ',' + mix(34, 104, e) + ')');
    g.addColorStop(1, 'rgb(' + mix(12, 244, e) + ',' + mix(15, 150, e) + ',' + mix(40, 98, e) + ')');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 0.7;
    var spread = phase === 'spread';
    for (var key in s.grid) {
      var cellP = s.grid[key], k = +key, cx = k % s.cols, cy = (k / s.cols) | 0;
      for (var ox = 0; ox <= 1; ox++) for (var oy = -1; oy <= 1; oy++) {
        if (ox === 0 && oy < 0) continue;
        var other = s.grid[(cx + ox) + (cy + oy) * s.cols]; if (!other) continue;
        for (var i = 0; i < cellP.length; i++) {
          var a = cellP[i];
          for (var j = (other === cellP ? i + 1 : 0); j < other.length; j++) {
            var b = other[j], dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
            if (d2 > R * R) continue;
            if (a.on && b.on) {
              var al = (1 - Math.sqrt(d2) / R) * 0.34 * a.lit * b.lit * global;
              ctx.strokeStyle = 'rgba(255,196,128,' + al.toFixed(3) + ')';
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
            } else if (spread && (a.on !== b.on)) {
              var src = a.on ? a : b, dst = a.on ? b : a;
              if (src.lit > 0.7 && Math.random() < 0.02) dst.on = true;
            }
          }
        }
      }
    }
    for (var n = 0; n < P.length; n++) {
      var p = P[n], l = p.lit * global;
      if (l > 0.01) {
        var tw = 0.82 + 0.18 * Math.sin(t * 2.2 + p.ph * 3);
        var sz = (26 + 30 * p.s) * (0.5 + 0.5 * l) * tw;
        ctx.globalAlpha = l;
        ctx.drawImage(spr, p.x - sz / 2, p.y - sz / 2, sz, sz);
      }
      if (l < 1) {
        ctx.globalAlpha = (1 - l) * 0.5;
        ctx.fillStyle = '#9aa9ee';
        ctx.fillRect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
      }
    }
    ctx.globalAlpha = 1;
  }

  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    draw(step(dt));
    requestAnimationFrame(frame);
  }

  resize(); seed();
  window.addEventListener('resize', function () { resize(); if (reduce) draw(step(0)); });
  cv.addEventListener('pointerdown', function (ev) {
    var r = cv.getBoundingClientRect();
    igniteNear(ev.clientX - r.left, ev.clientY - r.top);
    if (reduce) draw(step(0));
  });

  if (reduce) { // one still frame, mostly lit
    for (var i = 0; i < P.length; i++) if (Math.random() < 0.8) { P[i].on = true; P[i].lit = 1; }
    phase = 'still';
    var s = step(0); draw(s); setLine(LINES.length - 1);
  } else {
    // warm up so the first frame already has a small cluster alight
    for (var w = 0; w < 240; w++) draw(step(0.016));
    requestAnimationFrame(frame);
  }
})();
</script>

</body></html>
